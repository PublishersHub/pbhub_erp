# ─────────────────────────────────────────────────────────────────────────────
# hr-system.conf — production nginx for hr.cloudxbloom.com
#
# Two server blocks:
#   1. HTTP (:80)  — serves /.well-known/acme-challenge/ for cert renewal,
#                    redirects everything else to HTTPS.
#   2. HTTPS (:443) — terminates TLS, proxies /api/* to the api container,
#                     everything else to the web container.
#
# Cert paths assume `init-letsencrypt.sh` has placed real certs at
# /etc/letsencrypt/live/hr.cloudxbloom.com/. On a fresh host with no
# certs, run that script before starting nginx.
# ─────────────────────────────────────────────────────────────────────────────

# Upstreams — internal docker network resolves these by service name.
upstream hr_system_api {
    server api:3001;
    keepalive 16;
}

upstream hr_system_web {
    server web:3000;
    keepalive 16;
}

# ─── HTTP (:80) ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name hr.cloudxbloom.com;

    # ACME HTTP-01 challenge: certbot drops files into /var/www/certbot/
    # via the webroot plugin; we serve them here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (:443) ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hr.cloudxbloom.com;

    ssl_certificate     /etc/letsencrypt/live/hr.cloudxbloom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.cloudxbloom.com/privkey.pem;

    # Mozilla "intermediate" TLS profile (~95% browser compatibility, modern).
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS — tells browsers "always use HTTPS for this domain".
    # 6 months. Bump to 1y + preload after you're sure HTTPS is permanent.
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Misc security
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File uploads (receipts up to 25 MB per the api policies).
    client_max_body_size 30M;

    # Compression — text only, no double-compressing already-compressed assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
      text/plain text/css text/xml application/json application/javascript
      application/xml+rss application/atom+xml image/svg+xml;

    # ── /api/*  → api container ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://hr_system_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # ── ACME challenge (also accessible over HTTPS for dual-stack renewals) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Everything else → web container (Next.js) ────────────────────────────
    location / {
        proxy_pass http://hr_system_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Long-cache Next.js static assets
    location /_next/static/ {
        proxy_pass http://hr_system_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
